[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint"
version = "0.1.0"
description = "Identity-aware Graph RAG onboarding assistant for Zenvora"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "neo4j>=5.20,<6",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
anthropic = ["anthropic>=0.40"]  # only for LLM_PROVIDER=anthropic

[tool.setuptools.packages.find]
include = ["waypoint*"]

[tool.setuptools.package-data]
"waypoint.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs a running Neo4j (make up); `make test-graph` fails instead of skipping"]
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:neo4j"]
