# Neo4j 5 LTS. Vector indexes are built in from 5.13 (no plugin needed).
# NEO4J_USERNAME / NEO4J_PASSWORD are interpolated from .env by docker compose
# (NEO4J_USERNAME must be "neo4j" on Community). Nothing else from .env enters the container.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: waypoint-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u '${NEO4J_USERNAME}' -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  neo4j_data:
  neo4j_logs:
